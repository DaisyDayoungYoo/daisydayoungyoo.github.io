# ── About you ───────────────────────────────────────────────
#
# Your bio. Keep the three quote marks (""") on their own lines.
# A blank line starts a new paragraph.

bio = """
I’m a graduate journalism student at UC Berkeley focusing on data analysis and multimedia storytelling.
My journey into journalism began at age seven when my dad took me on a trip to the World Cup.
Traveling the world to watch games together fueled my passion for sports reporting.

Covering games ultimately revealed that data and numbers are often the most honest starting points for a story.
My reporting explores where data meets everyday life, ranging from sports analytics to local coverage in the East Bay. 
I’m currently expanding my work into visual and interactive journalism to translate complex datasets into compelling graphics.

Before coming to Berkeley, I studied Communication Journalism at the University of Utah.
I worked as a broadcast anchor and covered the Utah Jazz as a sports writer.
When I’m not reporting, you’ll usually find me digging through databases in R or Python or watching KBO.
"""

